name: CI

on:
  push:
    branches: [main, agent/m05-v3]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:
    inputs:
      installed_single_install:
        description: Use one install for Windows acceptance (false selects the two-install control)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Main pushes use immutable revisions so pending verification is not replaced.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # A superseded pull-request push has nothing left to prove, so it cancels.
  # Pushes to a protected branch are the post-merge verification of commits that
  # already landed: cancelling those meant no push run on main ever completed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: true

jobs:
  # The merge queue runs the full suite on a merge commit and then fast-forwards
  # main to that same commit, so the push run on main would repeat seven Windows
  # jobs on a revision that already passed them. This job looks for that passed
  # merge-queue run of the exact pushed commit. Only a positive result skips the
  # suite: no run, a failed lookup or a failed job here all keep it, and every
  # other event never reaches this job.
  proof:
    name: Find the merge-queue run that tested this commit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    steps:
      - name: Check out the lookup script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-queue-verified.mjs
          sparse-checkout-cone-mode: false

      - name: Look for a passed merge-queue run of this exact commit
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-queue-verified.mjs

  # Caches saved by a merge-queue run belong to its temporary branch. Only a run
  # on main refreshes the dependency caches that pull requests and queue entries
  # restore, so a push that skips the suite still installs the toolchain once.
  caches:
    name: Refresh shared toolchain caches
    needs: proof
    runs-on: windows-2022
    if: needs.proof.outputs.verified == 'true'
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: ./.github/actions/setup
        with:
          python: 'true'
          playwright: 'true'

  linux-path-guard-cleanup:
    name: Linux path guard cleanup
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run unprivileged broker cleanup regressions
        run: python3 -I -S -B tests/linux_path_guard_cleanup.py

  # A draft pull request is not reviewable, so its jobs run when it becomes
  # ready for review instead of on every draft push; draft pushes otherwise
  # starve the shared runner pool that required checks depend on.
  #
  # A reviewable pull request gets Windows checks plus the tests reachable from
  # its diff. The full suite (four shards, browser and installed-memory) runs in
  # the merge queue, so nothing reaches main without it, and again on any push
  # to main that the proof job above cannot tie to a passed merge-queue run.
  #
  # Small checks share one job so they pay for one runner and one toolchain
  # install. Every step after setup runs even when an earlier one fails, so the
  # job lists every failure instead of stopping at the first.
  checks:
    name: Windows checks
    needs: proof
    runs-on: windows-2022
    if: ${{ !cancelled() && needs.proof.outputs.verified != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          python: 'true'

      - name: Build and verify the public plug-in API package
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm build:plugin-api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/plugin-api-package.test.mjs

      - name: Install optional visuals plug-in dependencies
        id: visuals
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --dir plugins/personal-visuals install --ignore-workspace --frozen-lockfile

      - name: Exercise UI guard negative and positive fixtures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test:ui-guard

      - name: Check TypeScript and enforce UI architecture policy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint

      - name: Check the repository type program
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm typecheck

      - name: Typecheck the optional visuals plug-in
        if: ${{ !cancelled() && steps.visuals.outcome == 'success' }}
        run: pnpm --dir plugins/personal-visuals typecheck

      - name: Build the optional visuals plug-in
        if: ${{ !cancelled() && steps.visuals.outcome == 'success' }}
        run: pnpm --dir plugins/personal-visuals build

      - name: Build web application
        id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm build

      - name: Build desktop shell
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm desktop:build

      - name: Verify original source custody
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python -I -S -B tests/hermes_source_contract.py -v

      - name: Verify atomic learning controls
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python -I -S -B tests/hermes_atomic_controls.py -v

      - name: Verify original Hermes worker behavior
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python -I -S -B tests/hermes_source_worker.py -v

      - name: Verify native memory checkpoint ordering and failure isolation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python -B tests/memory_native_checkpoint_v3.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/memory_native_checkpoint_worker_v3.py -v

  # Four literal jobs, not a matrix: GitHub reports a skipped matrix job under its
  # unexpanded name, so the required "Tests (shard N/4)" checks would never report on PRs.
  test-1:
    name: Tests (shard 1/4)
    needs: proof
    runs-on: windows-2022
    if: ${{ !cancelled() && needs.proof.outputs.verified != 'true' && github.event_name != 'pull_request' }}
    timeout-minutes: 22
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: ./.github/actions/setup
        with:
          python: 'true'
          playwright: 'true'

      - name: Build web application
        run: pnpm build

      - name: Run application regression tests
        run: pnpm test --maxWorkers=1 --shard=1/4 --reporter=default --reporter=json --outputFile=test-results/durations/shard-1.json

      - name: Preserve per-file test durations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-durations-${{ github.run_id }}-${{ github.run_attempt }}-shard-1
          retention-days: 7
          if-no-files-found: ignore
          path: test-results/durations/**

  test-2:
    name: Tests (shard 2/4)
    needs: proof
    runs-on: windows-2022
    if: ${{ !cancelled() && needs.proof.outputs.verified != 'true' && github.event_name != 'pull_request' }}
    timeout-minutes: 22
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: ./.github/actions/setup
        with:
          python: 'true'
          playwright: 'true'

      - name: Build web application
        run: pnpm build

      - name: Run application regression tests
        run: pnpm test --maxWorkers=1 --shard=2/4 --reporter=default --reporter=json --outputFile=test-results/durations/shard-2.json

      - name: Preserve per-file test durations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-durations-${{ github.run_id }}-${{ github.run_attempt }}-shard-2
          retention-days: 7
          if-no-files-found: ignore
          path: test-results/durations/**

  test-3:
    name: Tests (shard 3/4)
    needs: proof
    runs-on: windows-2022
    if: ${{ !cancelled() && needs.proof.outputs.verified != 'true' && github.event_name != 'pull_request' }}
    timeout-minutes: 22
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: ./.github/actions/setup
        with:
          python: 'true'
          playwright: 'true'

      - name: Build web application
        run: pnpm build

      - name: Run application regression tests
        run: pnpm test --maxWorkers=1 --shard=3/4 --reporter=default --reporter=json --outputFile=test-results/durations/shard-3.json

      - name: Preserve per-file test durations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-durations-${{ github.run_id }}-${{ github.run_attempt }}-shard-3
          retention-days: 7
          if-no-files-found: ignore
          path: test-results/durations/**

  test-4:
    name: Tests (shard 4/4)
    needs: proof
    runs-on: windows-2022
    if: ${{ !cancelled() && needs.proof.outputs.verified != 'true' && github.event_name != 'pull_request' }}
    timeout-minutes: 22
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: ./.github/actions/setup
        with:
          python: 'true'
          playwright: 'true'

      - name: Build web application
        run: pnpm build

      - name: Run application regression tests
        run: pnpm test --maxWorkers=1 --shard=4/4 --reporter=default --reporter=json --outputFile=test-results/durations/shard-4.json

      - name: Preserve per-file test durations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-durations-${{ github.run_id }}-${{ github.run_attempt }}-shard-4
          retention-days: 7
          if-no-files-found: ignore
          path: test-results/durations/**

  test-linux:
    name: Linux tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: ./.github/actions/setup

      - name: Check the repository type program
        run: pnpm typecheck

      # vitest.linux.config.ts excludes tests measured to fail off Windows
      # (see issue #1318); every exclusion carries a reason in that file.
      - name: Run platform-independent tests
        run: pnpm exec vitest run --config vitest.linux.config.ts

  browser:
    name: Browser tests
    needs: proof
    runs-on: windows-2022
    if: ${{ !cancelled() && needs.proof.outputs.verified != 'true' && github.event_name != 'pull_request' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: ./.github/actions/setup
        with:
          python: 'true'
          playwright: 'true'

      - name: Build web application
        run: pnpm build

      - name: Exercise split workspace in the browser
        env:
          GEN_SPLIT_RENDERER_BROWSER: '1'
          GEN_SPLIT_APP_BROWSER: '1'
        run: pnpm exec vitest run tests/split-workspace-renderer.test.ts tests/split-app-browser.test.ts --maxWorkers=1

      - name: Exercise project memory and affected context browser flows
        run: |
          $failedSuites = @()
          foreach ($suite in @('project-memory', 'project-memory-host', 'usage-context', 'frontend-refinement', 'inbox-controls', 'root')) {
            pnpm test:browser --suite $suite
            if ($LASTEXITCODE -ne 0) { $failedSuites += $suite }
          }
          if ($failedSuites.Count -gt 0) {
            throw "Failed browser suites: $($failedSuites -join ', ')"
          }

      - name: Preserve browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            test-results/browser/**/results.json
            test-results/browser/**/artifacts/**/*.png
            test-results/browser/**/artifacts/**/trace.zip
            test-results/browser/**/artifacts/**/host-observations.json
            test-results/browser/**/artifacts/**/memory-host-observations.json

  installed-memory:
    name: Installed desktop memory retention and opt-in
    needs: proof
    runs-on: windows-2022
    if: ${{ !cancelled() && needs.proof.outputs.verified != 'true' && github.event_name != 'pull_request' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: ./.github/actions/setup
        with:
          python: 'true'

      - name: Stage pinned integration wheels for canonical packaging
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -Raw -LiteralPath third-party/integrations/PYTHON_LOCK.json | ConvertFrom-Json
          $wheels = Join-Path $env:RUNNER_TEMP ('gen-packaging-wheels-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $wheels | Out-Null
          $names = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($distribution in $lock.distributions) {
            if ($distribution.sourceUrl -notmatch '^https://files\.pythonhosted\.org/[^?#\s]+\.whl$' -or $distribution.wheelSha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid pinned integration wheel identity' }
            $name = [System.IO.Path]::GetFileName(([System.Uri]$distribution.sourceUrl).AbsolutePath)
            if ($name -notmatch '^[A-Za-z0-9_.+-]+\.whl$' -or -not $names.Add($name)) { throw 'Ambiguous pinned integration wheel filename' }
            $archive = Join-Path $wheels $name
            Invoke-WebRequest -Uri $distribution.sourceUrl -OutFile $archive -TimeoutSec 180
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $distribution.wheelSha256) { throw 'Pinned integration wheel archive checksum mismatch' }
          }
          "HARNESS_INTEGRATION_WHEELS=$wheels" >> $env:GITHUB_ENV
          Write-Output ('HARNESS_PINNED_INTEGRATION_WHEELS=' + (@{count=$names.Count; sourceLockSha256=(Get-FileHash -LiteralPath third-party/integrations/PYTHON_LOCK.json -Algorithm SHA256).Hash.ToLowerInvariant()} | ConvertTo-Json -Compress))

      - name: Stage declared Git and GitHub CLI packaging inputs
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -LiteralPath third-party/git-tools/manifest.json | ConvertFrom-Json
          $scratch = Join-Path $env:RUNNER_TEMP ('gen-installed-inputs-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $scratch | Out-Null
          foreach ($tool in @(@{name='git'; pin=$manifest.git}, @{name='gh'; pin=$manifest.github})) {
            $pin = $tool.pin
            if ($pin.url -notmatch '^https://github\.com/(git-for-windows/git|cli/cli)/releases/download/[^?#\s]+\.zip$' -or $pin.archiveSha256 -notmatch '^[0-9a-f]{64}$') {
              throw 'Invalid declared Git packaging archive identity'
            }
            $archive = Join-Path $scratch ($tool.name + '.zip')
            Invoke-WebRequest -Uri $pin.url -OutFile $archive -TimeoutSec 180
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.archiveSha256) {
              throw 'Declared Git packaging archive checksum mismatch'
            }
            $expanded = Join-Path $scratch $tool.name
            Expand-Archive -LiteralPath $archive -DestinationPath $expanded
            $source = $expanded
            if ($tool.name -eq 'gh' -and -not (Test-Path -LiteralPath (Join-Path $source 'bin/gh.exe'))) {
              $source = Join-Path $expanded ('gh_' + $pin.version + '_windows_amd64')
            }
            $prefix = '.harness-tool-bundles/' + $tool.name + '/'
            $destination = Join-Path $PWD ('.harness-tool-bundles/' + $tool.name)
            if (Test-Path -LiteralPath $destination) { throw 'Packaging input destination already exists' }
            New-Item -ItemType Directory -Path $destination | Out-Null
            foreach ($file in @($manifest.files | Where-Object { $_.path.StartsWith($prefix) })) {
              $relative = $file.path.Substring($prefix.Length)
              if ([string]::IsNullOrWhiteSpace($relative) -or $relative -match '(^|/)\.\.?(/|$)|[\\:]|^/|//|/$' -or $file.sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid declared Git payload path' }
              $payloadInput = Join-Path $source $relative
              $payloadOutput = Join-Path $destination $relative
              if ((Get-Item -LiteralPath $payloadInput).Length -ne $file.bytes -or (Get-FileHash -LiteralPath $payloadInput -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256) { throw 'Declared Git payload checksum mismatch' }
              New-Item -ItemType Directory -Path (Split-Path -Parent $payloadOutput) -Force | Out-Null
              Copy-Item -LiteralPath $payloadInput -Destination $payloadOutput
            }
          }
          node --import tsx --input-type=module -e "import {collectGitTools} from './scripts/git-assets.ts'; const value=await collectGitTools(process.cwd()); console.log(JSON.stringify({files:value.files.length,bytes:value.bytes}));"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the production Windows installer
        run: pnpm desktop:package --output-root .harness-installed-package

      - name: Verify installed default-off retention and separate enabled opt-in
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.installed_single_install == false }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          $release = Join-Path $PWD ('.harness-installed-package/desktop-release-' + $version)
          $setup = (Resolve-Path -LiteralPath (Join-Path $release ('Gen-V1-Setup-' + $version + '-win-x64.exe'))).Path
          $unpacked = (Resolve-Path -LiteralPath (Join-Path $release 'win-unpacked')).Path
          $verifyArgs = @('exec', 'tsx', 'scripts/verify-installed-desktop.ts', $setup, $unpacked, '--project-memory-retention', '--project-memory-enabled')
          Write-Output ('HARNESS_INSTALLED_VERIFY_ARGV=' + (@{executable='pnpm'; args=$verifyArgs} | ConvertTo-Json -Compress))
          & pnpm @verifyArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed default-off identity and direct module load
        env:
          INSTALLED_SINGLE_INSTALL: ${{ github.event_name != 'workflow_dispatch' || inputs.installed_single_install == true }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          $release = Join-Path $PWD ('.harness-installed-package/desktop-release-' + $version)
          $setup = (Resolve-Path -LiteralPath (Join-Path $release ('Gen-V1-Setup-' + $version + '-win-x64.exe'))).Path
          $unpacked = (Resolve-Path -LiteralPath (Join-Path $release 'win-unpacked')).Path
          $verifyArgs = @('exec', 'tsx', 'scripts/m16-installed-identity.ts', $setup, $unpacked)
          if ($env:INSTALLED_SINGLE_INSTALL -eq 'true') { $verifyArgs += '--single-install-acceptance' }
          Write-Output ('HARNESS_INSTALLED_VERIFY_ARGV=' + (@{executable='pnpm'; args=$verifyArgs} | ConvertTo-Json -Compress))
          & pnpm @verifyArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve installed verification receipts and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-memory-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .harness-installed-package/desktop-release-*/build-manifest.json
            .harness-installed-package/desktop-stage-*/desktop-host/third-party/integrations/PYTHON_INSTALLATION_V2.json
            .harness-desktop-installed/run-*/owner.json
            .harness-desktop-installed/run-*/verification.json
            .harness-desktop-installed/run-*/m16-identity-receipt.json
            .harness-desktop-installed/run-*/*.png
            .harness-desktop-installed/run-*/installed-memory-redacted-export.json
            .harness-desktop-installed/run-*/enabled-memory/owner.json
            .harness-desktop-installed/run-*/enabled-memory/*.png
            .harness-desktop-installed/run-*/enabled-memory/installed-memory-redacted-export.json
            .harness-desktop-installed/run-*/scenario-*.json
            .harness-desktop-installed/run-*/flag-free/owner.json
            .harness-desktop-installed/run-*/flag-free/*.png
            .harness-packaged-providers/run-*/verification.json

  # Lists the tests the pull request diff can reach (vitest.config.ts
  # forceRerunTriggers names the inputs that select every test) and sizes the
  # Windows shards to that list, about 35 test files per shard, at most four.
  select:
    name: Select tests reachable from the diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.select.outputs.shards }}
      total: ${{ steps.select.outputs.total }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The pull-request merge commit and its first parent, the base tip.
          fetch-depth: 2
          filter: blob:none

      - name: Install toolchain
        uses: ./.github/actions/setup

      - name: List tests reachable from the pull request diff
        id: select
        run: |
          pnpm exec vitest list --changed HEAD~1 --filesOnly --json="$RUNNER_TEMP/selected.json"
          node -e '
            const files = require(process.argv[1]);
            const total = Math.min(4, Math.ceil(files.length / 35));
            console.log(files.length + " test files selected, " + total + " shards");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "total=" + total + "\nshards=" + JSON.stringify(Array.from({length: total}, (_, i) => i + 1)) + "\n");
          ' "$RUNNER_TEMP/selected.json"

  selected:
    name: Selected tests (shard ${{ matrix.shard }}/${{ needs.select.outputs.total }})
    needs: select
    runs-on: windows-2022
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.select.outputs.total != '0'
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none

      - name: Install toolchain
        uses: ./.github/actions/setup
        with:
          python: 'true'
          playwright: 'true'

      - name: Build web application
        run: pnpm build

      - name: Run this shard of the tests reachable from the pull request diff
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.select.outputs.total }}
        # HEAD~1, not the caret spelling: pnpm.cmd runs through cmd.exe, which drops a caret,
        # so the shard compared against "HEAD1", found nothing changed and passed
        # without running a test. A shard that finds no test file now fails.
        run: pnpm test --maxWorkers=1 --changed HEAD~1 --passWithNoTests=false --shard $env:SHARD
