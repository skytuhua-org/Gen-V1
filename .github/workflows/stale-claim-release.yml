name: Stale claim audit

on:
  schedule:
    # Advisory only: inactivity never releases a worker's ownership.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compatibility input; every run is read-only, including false"
        type: boolean
        required: true
        default: true

permissions:
  issues: read

jobs:
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: stale-claim-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Report overdue scopes without changing ownership
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const STALE_MINUTES = 60;
            const trustedAuthor = (comment) => comment.user?.type === 'Bot' ||
              ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(comment.author_association);
            const escape = (value) => String(value).replace(/[&<>"']/g, (char) =>
              ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char]));
            const liveLines = (body) => {
              const lines = [];
              let fence = null, quote = false;
              for (const line of String(body || '').split(/\r?\n/)) {
                if (/^\s*>/.test(line)) { quote = true; continue; }
                if (!line.trim()) { quote = false; continue; }
                const marker = /^\s*(`{3,}|~{3,})/.exec(line)?.[1];
                if (marker) {
                  if (!fence) fence = marker;
                  else if (marker[0] === fence[0] && marker.length >= fence.length) fence = null;
                  continue;
                }
                // Blockquotes continue through un-prefixed paragraph lines until a
                // blank line; a quoted older record must never read as live fields.
                if (!fence && !quote && !/^(?: {4}|\t)/.test(line)) lines.push(line.trim());
              }
              return lines;
            };
            const parseScopes = (fields) => {
              const scopes = new Set();
              for (const value of fields.SCOPE || []) {
                for (const part of value.split(/[,;]/).map((scope) => scope.trim()).filter(Boolean)) {
                  const range = /^T(\d+)\s*-\s*T(\d+)$/i.exec(part);
                  if (range) {
                    const start = Number(range[1]), end = Number(range[2]);
                    if (!Number.isSafeInteger(end) || start > end || end - start > 99) return null;
                    for (let task = start; task <= end; task++) scopes.add('T' + String(task).padStart(range[1].length, '0'));
                  } else scopes.add(/^T\d+(?:[._-][a-z0-9]+)*$/i.test(part) || /^ALL$/i.test(part) ? part.toUpperCase() : part);
                }
              }
              // SCOPE is explicit custody metadata. TASKS is only a work journal:
              // the required full task matrix would refresh untouched scopes, so
              // TASKS-derived custody is never inferred — see the record loop.
              return scopes.has('ALL') && scopes.size > 1 ? null : [...scopes];
            };
            const overdue = [], review = [];
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            core.info('Read-only claim audit: no release, assignment, label or comment writes. Legacy dry_run does not change this.');
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const owners = new Map();
              const diagnose = (comment, worker, reason) => review.push({issue, comment, worker, reason});
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: issue.number, per_page: 100,
              });
              const records = [];
              for (const comment of comments) {
                if (!trustedAuthor(comment)) continue;
                const lines = liveLines(comment.body);
                const header = /^\[?([a-z0-9]+(?:-[a-z0-9]+){2,})\]?\s+((?:(?:(?:RESUME|SCOPE)\s+)?CLAIM|CHECKPOINT|RELEASED?)\b[^|]*)/i.exec(lines[0] || '');
                if (!header) {
                  if (/^(?:\[[^\]]+\]\s+)?(?:(?:(?:RESUME|SCOPE)\s+)?CLAIM|CHECKPOINT|RELEASED?)\b/i.test(lines[0] || '')) diagnose(comment, 'UNKNOWN', 'Unparseable worker header');
                  continue;
                }
                const worker = header[1], created = Date.parse(comment.created_at);
                if (!Number.isFinite(created)) { diagnose(comment, worker, 'Invalid creation timestamp'); continue; }
                const fields = {};
                for (const line of lines) {
                  // Fields are whole `KEY=value` segments between ; or | separators.
                  // OWNER accepts only a single token, so prose like "; OWNER=NONE
                  // would be required" never registers as an ownership field.
                  for (const segment of line.split(/[;|]/)) {
                    const m = /^\s*(OWNER|SCOPE|TASKS)\s*=\s*(.*?)\s*$/i.exec(segment);
                    if (!m) continue;
                    const key = m[1].toUpperCase(), value = m[2];
                    if (key === 'OWNER' && /\s/.test(value)) continue;
                    (fields[key] ||= []).push(value);
                  }
                }
                records.push({comment, worker, created, fields, header: header[2]});
              }
              records.sort((left, right) => left.created - right.created || left.comment.id - right.comment.id);
              for (const record of records) {
                const {comment, worker, fields, header} = record;
                const ownerFields = fields.OWNER || [];
                if (new Set(ownerFields).size > 1 || ownerFields.some((owner) => owner !== worker && owner.toUpperCase() !== 'NONE')) {
                  diagnose(comment, worker, 'OWNER conflict; existing scopes preserved'); continue;
                }
                let scopes = parseScopes(fields);
                if (!scopes) { diagnose(comment, worker, 'Invalid or ambiguous scope fields'); continue; }
                if (!fields.SCOPE?.length && fields.TASKS?.length) {
                  diagnose(comment, worker, 'TASKS is a work journal, not custody; SCOPE= required to refresh claim scope');
                  continue;
                }
                const active = owners.get(worker) || new Map();
                owners.set(worker, active);
                const released = /(?:^|[+/])\s*RELEASED?\b/i.test(header) || ownerFields.some((owner) => owner.toUpperCase() === 'NONE');
                const claimed = /(?:^|[+/])\s*(?:(?:RESUME|SCOPE)\s+)?CLAIM\b/i.test(header) && !released;
                if (scopes.includes('ALL')) {
                  if (!released) { diagnose(comment, worker, 'SCOPE=ALL requires an explicit release'); continue; }
                  scopes = [...active.keys()];
                } else if (!scopes.length) {
                  if (active.size === 1) scopes = [...active.keys()];
                  else if (claimed && active.size === 0) {
                    scopes = ['UNSPECIFIED'];
                    diagnose(comment, worker, 'Claim has no structured scope; manual review required');
                  } else {
                    diagnose(comment, worker, 'Ambiguous scope-less record; existing scopes preserved'); continue;
                  }
                }
                for (const scope of scopes) {
                  if (claimed) active.set(scope, record);
                  else if (!active.has(scope)) diagnose(comment, worker, 'Unmatched scope ' + scope + '; existing scopes preserved');
                  else if (released) active.delete(scope);
                  else active.set(scope, record);
                }
              }
              for (const [worker, scopes] of owners) {
                for (const [scope, record] of scopes) {
                  const ageMinutes = (Date.now() - record.created) / 60000;
                  if (ageMinutes > STALE_MINUTES) overdue.push({issue, worker, scope, comment: record.comment, ageMinutes});
                }
              }
            }
            const issueLink = (issue) => `<a href="${escape(issue.html_url)}">#${issue.number} ${escape(issue.title)}</a>`;
            const commentLink = (comment) => `<a href="${escape(comment.html_url)}">comment ${escape(comment.id)}</a>`;
            core.info(`Found ${overdue.length} overdue scope record(s) and ${review.length} record(s) requiring manual review. Ownership is unchanged.`);
            for (const {issue, worker, scope, ageMinutes, comment} of overdue) core.info('Overdue: ' + JSON.stringify({issue: issue.number, worker, scope, ageMinutes, evidence: comment.html_url}));
            for (const {issue, worker, reason, comment} of review) core.info('Manual review: ' + JSON.stringify({issue: issue.number, worker, reason, evidence: comment.html_url}));
            core.summary.addHeading('Stale claim audit');
            core.summary.addRaw('Advisory only. More than 60 minutes without a matching record does not release ownership or authorize takeover. Explicit owner release or maintainer reassignment is still required.\n');
            core.summary.addHeading('Overdue scope records', 2);
            core.summary.addTable([
              ['Issue', 'Worker', 'Scope', 'Age in minutes', 'Last matching record'],
              ...overdue.map(({issue, worker, scope, ageMinutes, comment}) => [issueLink(issue), escape(worker), escape(scope), ageMinutes.toFixed(1), commentLink(comment)]),
            ]);
            core.summary.addHeading('Records requiring manual review', 2);
            core.summary.addTable([
              ['Issue', 'Worker', 'Reason', 'Record'],
              ...review.map(({issue, worker, reason, comment}) => [issueLink(issue), escape(worker), escape(reason), commentLink(comment)]),
            ]);
            await core.summary.write();
