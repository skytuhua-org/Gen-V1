name: CI closed PR cleanup

on:
  pull_request_target:
    types: [closed]

permissions: {}

# Cancel the closed PR's obsolete CI without a runner or API token.
# A reopened PR triggers fresh CI through the source workflow's reopened event.
concurrency:
  group: ${{ format('CI-refs/pull/{0}/merge', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: ':'
