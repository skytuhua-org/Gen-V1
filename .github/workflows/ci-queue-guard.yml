name: CI queue guard

on:
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress]
  push:
    branches: [main]
    paths: [.github/workflows/ci-queue-guard.yml]

permissions:
  actions: write
  pull-requests: read

jobs:
  guard:
    # Job admission precedes matrix expansion and scheduling. Invalid notifications
    # must not replace a pending sweep in the shared job concurrency group.
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' &&
      (github.event.action == 'requested' || github.event.action == 'in_progress') &&
      github.event.workflow_run.id > 0 && github.event.workflow_run.id != github.run_id &&
      github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.repository.id == github.event.repository.id)
    concurrency:
      group: ci-queue-guard
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run uses this default-branch code, even for stacked old bases.
      # No PR checkout, artifacts, caches, or event interpolation enter the script.
      - name: Cancel obsolete PR runs using current GitHub metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const api = {...context.repo, request: {timeout: 10000}};
            const repositoryId = context.payload.repository?.id;
            const active = new Set(['queued', 'in_progress', 'requested', 'waiting', 'pending']);
            const summary = {checked: 0, cancellationRequested: 0, preserved: 0, raced: 0, limited: false};
            const validId = value => Number.isSafeInteger(value) && value > 0;
            const validSha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
            const finish = () => {core.info('CI queue guard: ' + JSON.stringify(summary)); return summary;};
            if (!validId(repositoryId)) return finish();
            async function read(method, parameters) {
              try {return (await method({...api, ...parameters})).data;}
              catch (error) {if (error.status === 404) return null; throw error;}
            }
            function association(run, id) {
              if (!run || run.id !== id || id === context.runId || run.name !== 'CI' ||
                  run.path !== '.github/workflows/ci.yml' || run.event !== 'pull_request' ||
                  run.repository?.id !== repositoryId || !active.has(run.status) ||
                  !validSha(run.head_sha) || !Array.isArray(run.pull_requests) || run.pull_requests.length !== 1) return null;
              const pr = run.pull_requests[0];
              if (!validId(pr.number) || pr.base?.repo?.id !== repositoryId || !validId(run.head_repository?.id) ||
                  pr.head?.repo?.id !== run.head_repository.id || pr.head?.ref !== run.head_branch) return null;
              return pr;
            }
            const commitProofs = new Map();
            async function cachePullCommits(pr) {
              // GitHub refreshes an old run's associated head to the current PR
              // head. Prove source membership separately; a merge SHA mismatch
              // alone must never cancel current work. The API caps PR commits
              // at 250, so missing/truncated proof conservatively preserves it.
              const key = pr.number + ':' + pr.head.sha;
              if (!commitProofs.has(key)) {
                const commits = new Set();
                for (let page = 1; page <= 3; page++) {
                  const data = await read(github.rest.pulls.listCommits, {pull_number: pr.number, per_page: 100, page});
                  if (!Array.isArray(data)) break;
                  for (const commit of data) if (validSha(commit.sha)) commits.add(commit.sha);
                  if (data.length < 100) break;
                }
                commitProofs.set(key, commits);
              }
            }
            function matchesPull(run, associated, pr) {
              return pr && pr.number === associated.number && pr.base?.repo?.id === repositoryId &&
                pr.head?.repo?.id === run.head_repository.id && pr.head?.ref === run.head_branch && validSha(pr.head?.sha);
            }
            function reason(run, associated, pr) {
              if (!matchesPull(run, associated, pr)) return null;
              if (pr.state === 'closed') return 'closed';
              if (pr.state !== 'open') return null;
              if (pr.draft === true) return 'draft';
              if (pr.draft === false && pr.head.sha !== run.head_sha &&
                  (associated.head.sha === run.head_sha || commitProofs.get(pr.number + ':' + pr.head.sha)?.has(run.head_sha))) return 'superseded';
              return null;
            }
            if (context.eventName === 'workflow_run') {
              const source = context.payload.workflow_run;
              if (!['requested', 'in_progress'].includes(context.payload.action) || !validId(source?.id) ||
                  source.id === context.runId || source.event !== 'pull_request' || source.name !== 'CI' ||
                  source.path !== '.github/workflows/ci.yml' || source.repository?.id !== repositoryId) return finish();
            } else if (context.eventName !== 'push' || context.ref !== 'refs/heads/' + context.payload.repository.default_branch) return finish();
            // Pending events coalesce, so every admitted event sweeps the backlog.
            // Discover up to ten pages per queue before cancelling. Prioritize
            // potential old revisions even when they are beyond the first page;
            // their metadata affects order only, never cancellation authority.
            // Retain the existing 100-candidate execution budget.
            const pages = [];
            for (const status of ['queued', 'in_progress']) {
              const runs = [];
              let total = 0;
              for (let page = 1; page <= 10; page++) {
                const {data} = await github.rest.actions.listWorkflowRuns({...api, workflow_id: 'ci.yml', event: 'pull_request', status, per_page: 100, page});
                runs.push(...data.workflow_runs);
                total = data.total_count;
                if (data.workflow_runs.length < 100 || runs.length >= total) break;
              }
              pages.push(runs);
              summary.limited ||= total > runs.length;
            }
            // Interleave both queues: a full queued page must not starve in-progress runs.
            const discovered = [];
            for (let index = 0; index < Math.max(pages[0].length, pages[1].length); index++) {
              for (const page of pages) if (index < page.length) discovered.push(page[index]);
            }
            const priority = run => run.pull_requests?.length === 1 && validSha(run.pull_requests[0].head?.sha) &&
              run.pull_requests[0].head.sha !== run.head_sha ? 0 : run.id === context.payload.workflow_run?.id ? 1 : 2;
            const candidates = [...new Map(discovered.filter(run => validId(run.id)).map(run => [run.id, run])).values()]
              .sort((left, right) => priority(left) - priority(right)).map(run => run.id);
            summary.limited ||= candidates.length > 100;
            for (const id of candidates.slice(0, 100)) {
              summary.checked++;
              const run = await read(github.rest.actions.getWorkflowRun, {run_id: id});
              const associated = association(run, id);
              if (!associated) {summary.preserved++; continue;}
              const pr = await read(github.rest.pulls.get, {pull_number: associated.number});
              if (matchesPull(run, associated, pr) && pr.state === 'open' && pr.draft === false &&
                  pr.head.sha !== run.head_sha && associated.head.sha !== run.head_sha) await cachePullCommits(pr);
              if (!reason(run, associated, pr)) {summary.preserved++; continue;}
              // Finish all proof requests before the final authority reads. A
              // changed head without cached proof is preserved for a later sweep;
              // deciding below must never add another network proof window.
              const currentRun = await read(github.rest.actions.getWorkflowRun, {run_id: id});
              const currentAssociation = association(currentRun, id);
              if (!currentAssociation || currentAssociation.number !== associated.number) {summary.raced++; continue;}
              const currentPr = await read(github.rest.pulls.get, {pull_number: associated.number});
              const currentReason = reason(currentRun, currentAssociation, currentPr);
              if (!currentReason) {summary.raced++; continue;}
              try {
                await github.rest.actions.cancelWorkflowRun({...api, run_id: id});
                summary.cancellationRequested++;
                core.info('Requested cancellation of CI run ' + id + ': ' + currentReason);
              } catch (error) {
                if (error.status === 404 || error.status === 409) summary.raced++;
                else throw error;
              }
            }
            // Old-base ready PRs still need the CI lifecycle policy from main.
            // This guard never reruns an old draft payload or bypasses checks.
            return finish();
